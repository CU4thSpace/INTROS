<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://use.typekit.net/paf7uxj.css">
<title>Concordia 4th Space – Event Script</title>
<style>
  :root{
    --bg:#111; --ink:#ccc; --white:#fff; --dim:rgba(255,255,255,0.55);
    --field:rgba(255,255,255,0.08); --field-line:rgba(255,255,255,0.35);
    --btn:rgba(255,255,255,0.2); --btn-hover:rgba(255,255,255,0.4);
    --font:"gill-sans-nova-condensed","Gill Sans Nova","Gill Sans MT Condensed","Gill Sans","Arial Narrow",sans-serif;
    --size:1.9rem;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.2}

  .bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;
    padding:.6rem 1.25rem;background:var(--bg);border-bottom:1px solid rgba(255,255,255,0.2)}
  .bar .name{font-size:1.4rem;font-weight:bold;color:var(--white)}
  .bar .name span{font-weight:100;font-style:italic;color:var(--ink);margin-left:.5rem}
  .tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .langs{display:flex;gap:4px;padding-right:10px;margin-right:2px;border-right:1px solid rgba(255,255,255,0.25)}
  .btn{font-family:var(--font);font-size:1.2rem;color:var(--white);background:var(--btn);border:none;border-radius:8px;
    min-width:50px;height:50px;padding:0 1rem;cursor:pointer}
  .btn:hover{background:var(--btn-hover)}
  .btn.warn{background:#912338}
  .btn[aria-pressed="true"]{background:var(--white);color:#111;font-weight:bold}
  .btn:focus-visible,.field:focus-visible,.tod:focus-visible,.chip:focus-visible{outline:3px solid var(--white);outline-offset:2px}

  main{max-width:62rem;margin:2rem auto 5rem;padding:0 1.25rem}
  .script{border:6px solid var(--white);padding:clamp(1.25rem,4vw,3rem)}
  .script p{margin:0 0 1.1em;font-size:var(--size);opacity:.95}
  .script i{color:#8fd0ff}
  .part{font-size:1.4rem !important;font-weight:100;font-style:italic;color:var(--dim);letter-spacing:.02em;opacity:1 !important}

  .field{display:block;width:100%;margin:0 0 .9rem;padding:.5rem .8rem;resize:none;overflow:hidden;min-height:3.2rem;
    font-family:var(--font);font-size:var(--size);line-height:1.2;color:var(--white);
    background:var(--field);border:2px dashed var(--field-line);border-radius:8px}
  .field::placeholder{color:var(--dim);font-weight:100;font-style:italic}
  .field:not(:placeholder-shown){border-style:solid;border-color:var(--white);font-weight:bold}

  /* Directory section: its own block at the bottom of the page */
  .dir{margin-top:2rem;padding:1.25rem clamp(1.25rem,4vw,3rem) 1.5rem;border:2px solid rgba(255,255,255,0.3);border-radius:12px}
  .dir h2{margin:0 0 .2rem;font-size:1.4rem;font-weight:bold;color:var(--white)}
  .dir h2 span{font-weight:100;font-style:italic;color:var(--dim);margin-left:.5rem;font-size:1.1rem}
  .dir .hint{margin:0 0 1rem;font-size:1.05rem;color:var(--dim);font-style:italic}
  .chips{font-family:var(--font)}
  .person{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:0 0 .9rem}
  .pname{font-size:1.5rem;font-weight:bold;color:var(--white);min-width:14rem}
  .chip{display:inline-flex;align-items:center;padding:.6rem 1.2rem;min-height:3.2rem;border-radius:999px;font-family:var(--font);font-size:1.3rem;
    line-height:1.1;color:#1d1d1d;border:2px solid transparent;text-decoration:none;cursor:pointer;font-weight:bold}
  .chip:hover{filter:brightness(1.08)}
  .chip.find{background:#cfe4f7}
  .chip.web{background:#f7d0e3}

  .sep{border:0;border-top:2px solid rgba(255,255,255,0.25);margin:2.5rem 0}
  .tod{font-family:var(--font);font-size:inherit;font-weight:bold;color:var(--white);background:var(--field);
    border:2px solid var(--white);border-radius:8px;padding:0 .4rem;max-width:100%}
  .tod option{background:#222;color:#fff}
  .pick{font-size:1.1rem;height:50px;max-width:18rem;padding:0 .6rem}
  [hidden]{display:none !important}

  .status{position:fixed;left:1.25rem;bottom:1rem;font-size:1rem;color:var(--dim);font-style:italic}

  @media print{.bar,.status,.dir{display:none}body{background:#fff;color:#000}.script{border:0}.field{border:0;background:none;color:#000;padding:0}.script p,.script i{color:#000}.script i{color:#1a5a8a}}
</style>
</head>
<body>
<div class="bar">
  <div class="name">4th Space<span>Introduction Script v1.8</span></div>
  <div class="tools">
    <div class="langs" role="group" aria-label="Script language">
      <button type="button" class="btn lang" data-lang="fr" aria-pressed="true">Français</button>
      <button type="button" class="btn lang" data-lang="en" aria-pressed="false">English</button>
      <button type="button" class="btn lang" data-lang="bi" aria-pressed="false">Bilingual</button>
    </div>
    <select class="tod pick" id="pick" aria-label="Choose today's event" hidden></select>
    <button type="button" class="btn" id="fill">Fill from today's event</button>
    <button type="button" class="btn" id="smaller" aria-label="Smaller text">A−</button>
    <button type="button" class="btn" id="larger" aria-label="Larger text">A+</button>
    <button type="button" class="btn" id="clear">Clear all boxes</button>
  </div>
</div>

<main>
<article class="script">
  <p class="part" data-part="0"></p>
  <div data-sec="Greeting"></div>

  <textarea class="field" rows="1" data-key="title"></textarea>
  <textarea class="field" rows="1" data-key="description"></textarea>
  <textarea class="field" rows="1" data-key="notes1"></textarea>

  <div data-sec="Territorial"></div>
  <div data-sec="FourspIntro"></div>
  <div data-sec="Rules"></div>

  <textarea class="field" rows="1" data-key="speaker"></textarea>
  <textarea class="field" rows="1" data-key="notes2"></textarea>

  <hr class="sep">
  <p class="part" data-part="1"></p>
  <div data-sec="Questions"></div>

  <hr class="sep">
  <p class="part" data-part="2"></p>
  <div data-sec="Conclusion"></div>
</article>

<section class="dir" id="dir" aria-labelledby="dirh" hidden>
  <h2 id="dirh">Look up names</h2>
  <p class="hint">Names found in the Moderator box. Blue jumps straight to the top concordia.ca result for the name; pink shows Google results for the exact name in quotes.</p>
  <div class="chips" id="chips" aria-live="polite"></div>
</section>
</main>
<div class="status" id="status" aria-live="polite"></div>

<script>
(function(){
  var KEY = '4thspace-event-script-v1';
  var BASE = 'https://cu4thspace.github.io/INTROS/';
  var SOURCES = { fr: BASE + 'STRUCTURED_FR.html', en: BASE + 'STRUCTURED_ENG.html', bi: BASE + 'STRUCTURED_BILINGUAL.html' };
  var UI = {
    fr: { html: 'fr', parts: ['Accueil', 'Questions', 'Conclusion'], title: 'Titre de l’événement', description: 'Sous-titre', notes: 'Notes', speaker: 'Nom et titre' },
    en: { html: 'en', parts: ['Welcome', 'Questions', 'Closing'], title: 'Event title', description: 'Subtitle', notes: 'Notes', speaker: 'Name and title' },
    bi: { html: 'fr', parts: ['Accueil / Welcome', 'Questions', 'Conclusion / Closing'], title: 'Titre de l’événement / Event title', description: 'Sous-titre / Subtitle', notes: 'Notes', speaker: 'Nom et titre / Name and title' }
  };

  var fields = document.querySelectorAll('.field');
  var statusEl = document.getElementById('status');
  var clearBtn = document.getElementById('clear');
  var langBtns = document.querySelectorAll('.lang');
  var size = 1.9; // rem
  var lang = 'fr';
  var tods = {};      // chosen time-of-day wording, per language
  var todOpts = [];   // options found in the current script's closing line
  var statusTimer;

  function grow(el){ el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
  function growAll(){ fields.forEach(grow); }
  function say(msg, ms){
    statusEl.textContent = msg;
    clearTimeout(statusTimer);
    statusTimer = setTimeout(function(){ statusEl.textContent = ''; }, ms || 2000);
  }
  function applySize(){
    document.documentElement.style.setProperty('--size', size + 'rem');
    growAll();
  }

  function save(){
    var data = { lang: lang, tod: tods, size: size, fields: {} };
    fields.forEach(function(el){ data.fields[el.dataset.key] = el.value; });
    try { localStorage.setItem(KEY, JSON.stringify(data)); say('Saved'); } catch(e) {}
  }

  function load(){
    var data = null;
    try { data = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e) {}
    if (data && SOURCES[data.lang]) lang = data.lang;
    if (data && data.tod && typeof data.tod === 'object') tods = data.tod; // older saves held a single string: ignored
    if (data && typeof data.size === 'number') size = data.size;
    if (data && data.fields) {
      fields.forEach(function(el){ el.value = data.fields[el.dataset.key] || ''; });
    }
    applySize();
  }

  var speakerEl = document.querySelector('.field[data-key="speaker"]');
  var chipTimer;
  fields.forEach(function(el){
    el.addEventListener('input', function(){
      grow(el); save();
      if (el === speakerEl){ clearTimeout(chipTimer); chipTimer = setTimeout(updateChips, 200); }
    });
  });
  window.addEventListener('resize', growAll);

  document.getElementById('smaller').addEventListener('click', function(){
    size = Math.max(1.1, +(size - 0.2).toFixed(1)); applySize(); save();
  });
  document.getElementById('larger').addEventListener('click', function(){
    size = Math.min(4, +(size + 0.2).toFixed(1)); applySize(); save();
  });

  // Two-step clear so it can't be wiped by one stray click
  var armed = false, armTimer;
  clearBtn.addEventListener('click', function(){
    if (!armed) {
      armed = true;
      clearBtn.textContent = 'Click again to clear';
      clearBtn.classList.add('warn');
      armTimer = setTimeout(disarm, 3000);
      return;
    }
    disarm();
    fields.forEach(function(el){ el.value = ''; });
    lastAuto = {};
    tods = {};
    bindTod();
    growAll();
    updateChips();
    save();
    say('Cleared');
  });
  function disarm(){
    armed = false;
    clearTimeout(armTimer);
    clearBtn.textContent = 'Clear all boxes';
    clearBtn.classList.remove('warn');
  }

  /* ---------- Script text for each language, pulled from the hosted files ---------- */
  function esc(s){ return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  // Keep only text, line breaks and italics from a source <div>
  function nodeHTML(n){
    var s = '';
    n.childNodes.forEach(function(c){
      if (c.nodeType === 3) s += esc(c.nodeValue);
      else if (c.nodeType === 1){
        if (c.tagName === 'I' || c.tagName === 'EM') s += '<i>' + nodeHTML(c) + '</i>';
        else if (c.tagName === 'BR') s += '\n';
        else s += nodeHTML(c);
      }
    });
    return s;
  }

  // id -> text. The files use "Territorial" twice; the second one is the lower notes box (unused here).
  function parseSource(text){
    var doc = new DOMParser().parseFromString(text.replace(/<i\s*\/>/gi, '</i>'), 'text/html');
    var out = {}, seen = {};
    doc.querySelectorAll('div[id]').forEach(function(d){
      var id = d.id.trim();
      if (seen[id]) id = 'LowNotes';
      seen[id] = 1;
      out[id] = nodeHTML(d);
    });
    return out;
  }

  // Blank line = new paragraph, line break = <br>; italics are re-opened on each line so they survive the split
  function paragraphs(raw){
    var paras = [], cur = [], depth = 0;
    raw.replace(/[\u202A-\u202E]/g, '').split('\n').forEach(function(line){
      line = line.replace(/\s+/g, ' ').trim();
      if (!line){ if (cur.length){ paras.push(cur); cur = []; } return; }
      var start = depth > 0;
      depth = Math.max(0, depth + (line.match(/<i>/g) || []).length - (line.match(/<\/i>/g) || []).length);
      cur.push((start ? '<i>' : '') + line + (depth > 0 ? '</i>' : ''));
    });
    if (cur.length) paras.push(cur);
    return paras.map(function(p){ return '<p>' + p.join('<br>') + '</p>'; }).join('');
  }

  var TOD = '@@TOD@@';
  // Closing line: turn the list of wordings (a **bold list** or a [bracketed list]) into one drop-down
  function closing(raw){
    todOpts = [];
    raw = raw.replace(/ - /g, ' — ');
    var m = raw.match(/^[ \t]*\*\*([^*\n]+)\*\*[ \t]*$/m);
    if (m && m[1].indexOf(',') > -1){
      todOpts = m[1].split(',').map(function(s){ return s.trim(); }).filter(Boolean);
      raw = raw.replace(m[0], '');
      var swapped = raw.replace(/(une bonne )(\S+)/i, '$1' + TOD);
      raw = swapped !== raw ? swapped : raw + '\n' + TOD;
    } else {
      var b = raw.match(/\[([^\]]*[,\/][^\]]*)\]/);
      if (b){
        todOpts = b[1].split(/\s*[,\/]\s*/).filter(Boolean);
        raw = raw.replace(b[0], TOD);
      }
    }
    return paragraphs(raw).replace(TOD, '<select class="tod" data-tod aria-label="Moment de la journée"></select>');
  }

  function defaultIdx(opts){
    var h = new Date().getHours();
    var keys = h < 12 ? ['matin', 'morning'] : (h < 17 ? ['après-midi', 'afternoon'] : ['soir', 'evening']);
    for (var i = 0; i < opts.length; i++){
      for (var k = 0; k < keys.length; k++){ if (opts[i].toLowerCase().indexOf(keys[k]) > -1) return i; }
    }
    return 0;
  }

  function bindTod(){
    var sel = document.querySelector('select[data-tod]');
    if (!sel) return;
    sel.innerHTML = '';
    todOpts.forEach(function(t){
      var o = document.createElement('option');
      o.value = o.textContent = t;
      sel.appendChild(o);
    });
    sel.selectedIndex = defaultIdx(todOpts);
    if (tods[lang] && todOpts.indexOf(tods[lang]) > -1) sel.value = tods[lang];
    sel.addEventListener('change', function(){ tods[lang] = sel.value; save(); });
  }

  function render(text){
    var src = parseSource(text);
    document.querySelectorAll('[data-sec]').forEach(function(el){
      var id = el.dataset.sec, s = src[id];
      el.innerHTML = (s == null) ? '' : (id === 'Conclusion' ? closing(s) : paragraphs(s));
    });
    bindTod();
    growAll();
  }

  function cacheGet(l){ try { return localStorage.getItem(KEY + '-src-' + l); } catch(e){ return null; } }
  function cacheSet(l, t){ try { localStorage.setItem(KEY + '-src-' + l, t); } catch(e){} }

  function setLang(l){
    lang = l;
    var ui = UI[l];
    document.documentElement.lang = ui.html;
    langBtns.forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.lang === l ? 'true' : 'false'); });
    document.querySelectorAll('[data-part]').forEach(function(p){ p.textContent = ui.parts[+p.dataset.part]; });
    fields.forEach(function(el){
      var k = el.dataset.key;
      var ph = k === 'title' ? ui.title : k === 'description' ? ui.description : k === 'speaker' ? ui.speaker : ui.notes;
      el.placeholder = ph;
      el.setAttribute('aria-label', ph);
    });
    var cached = cacheGet(l);
    if (cached) render(cached); else say('Loading script…', 4000);
    fetch(SOURCES[l], { cache: 'no-cache', credentials: 'omit' }).then(function(r){
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function(t){
      if (t === cached) return;
      cacheSet(l, t);
      if (lang === l){ render(t); say('Script updated'); }
    }).catch(function(){
      if (lang === l && !cached) say('Could not load the script text for this language', 5000);
    });
  }

  langBtns.forEach(function(b){
    b.addEventListener('click', function(){
      if (b.dataset.lang === lang) return;
      setLang(b.dataset.lang);
      save();
    });
  });

  /* ---------- Look up names (two Google searches per name) ---------- */
  var chipsEl = document.getElementById('chips');
  var dirEl = document.getElementById('dir');

  // Names the page could be speaking about: items under a participants-type label, name-shaped only
  var NAME_LABEL = /particip|speaker|with|moderat|host|present|panel|guest|invit|animat|conférenc|modér|avec|présent/i;
  var NAME_WORD = /^[A-ZÀ-ÖØ-Þ][\p{L}'’.\-]*$/u;
  function candidates(text){
    var out = [], label = '';
    text.split('\n').forEach(function(line){
      line = line.trim();
      if (!line) return;
      var m = line.match(/^([^:]{1,40}):\s*(.*)$/), parts;
      if (m){ label = m[1]; parts = m[2] ? m[2].split(/\s*(?:;|,| and | et | & )\s*/) : []; }
      else parts = [line.split(/\s*(?:,|\(|–|—| - )\s*/)[0]];
      if (!NAME_LABEL.test(label)) return;
      parts.forEach(function(p){
        p = p.replace(/^(?:dr|dre|prof|pr|mr|mrs|ms|mme|mx|professor|professeure?)\b\.?\s+/i, '').trim();
        var w = p.split(/\s+/);
        if (w.length >= 2 && w.length <= 4 && w.every(function(x){ return NAME_WORD.test(x); })) out.push(p);
      });
    });
    return out;
  }

  function updateChips(){
    chipsEl.innerHTML = '';
    var seen = {}, names = candidates(speakerEl.value).filter(function(n){
      var k = n.toLowerCase();
      if (seen[k]) return false;
      return (seen[k] = 1);
    });
    dirEl.hidden = !names.length;
    names.forEach(function(n){
      var row = document.createElement('div');
      row.className = 'person';
      var nm = document.createElement('span');
      nm.className = 'pname'; nm.textContent = n;
      row.appendChild(nm);
      [['find', 'Concordia top result ↗', 'site:concordia.ca "' + n + '"', 'Opens the first Google result on concordia.ca directly'],
       ['web', 'All of Google ↗', '"' + n + '"', 'Google search of the whole web']].forEach(function(b){
        var a = document.createElement('a');
        a.className = 'chip ' + b[0]; a.target = '_blank'; a.rel = 'noopener'; a.textContent = b[1]; a.title = b[3];
        a.href = 'https://www.google.com/search?q=' + encodeURIComponent(b[2]) + (b[0] === 'find' ? '&btnI=I' : '');
        row.appendChild(a);
      });
      chipsEl.appendChild(row);
    });
  }

  /* ---------- Fill title, subtitle and names from today's event on concordia.ca ---------- */
  var LIST_URL = "https://www.concordia.ca/next-gen/4th-space/programming/fullcalendar.html";
  var fillBtn = document.getElementById('fill');
  var pick = document.getElementById('pick');
  var todays = [], listLoaded = false, lastAuto = {};

  function clean(str){ return (str || '').replace(/\s+/g, ' ').trim(); }

  function fetchText(url){
    return fetch(url, { credentials: 'omit' }).then(function(r){
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    });
  }

  function todayString(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // Event links on the calendar page carry the date in the URL (/YYYY/MM/DD/)
  function findToday(html){
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var today = todayString(), seen = {}, out = [];
    doc.querySelectorAll('a[href*="/cuevents/"]').forEach(function(a){
      var href = a.getAttribute('href');
      if (!href) return;
      var m = href.match(/\/(\d{4})\/(\d{2})\/(\d{2})\//);
      if (!m || (m[1] + '-' + m[2] + '-' + m[3]) !== today) return;
      var link;
      try { link = new URL(href, LIST_URL).href.replace(/^http:/, 'https:'); } catch(e){ return; }
      var title = clean(a.textContent) || clean(a.getAttribute('title'));
      if (!title || seen[link]) return;
      seen[link] = 1;
      out.push({ title: title, link: link });
    });
    return out;
  }

  // The elements (paragraphs and lists) inside the event's Credits section
  function creditsElements(doc){
    var body = null;
    doc.querySelectorAll('.accordion-header').forEach(function(h){
      if (body) return;
      if (clean(h.textContent).toUpperCase().indexOf('CREDIT') === 0){
        var item = h.closest('.accordion-item');
        body = item ? item.querySelector('.accordion-body') : null;
      }
    });
    if (body){
      var rte = body.querySelector('.rte') || body;
      return Array.prototype.filter.call(rte.children, function(c){ return c.tagName === 'P' || c.tagName === 'UL'; });
    }
    // Fallback: a heading that starts with "Credits"; read until the next heading of the same level or higher, or a rule
    var els = [], heads = doc.querySelectorAll('h1, h2, h3, h4');
    for (var i = 0; i < heads.length; i++){
      if (clean(heads[i].textContent).toUpperCase().indexOf('CREDIT') !== 0) continue;
      var level = +heads[i].tagName.charAt(1);
      var sib = heads[i].nextElementSibling;
      while (sib && sib.tagName !== 'HR' && !(/^H[1-6]$/.test(sib.tagName) && +sib.tagName.charAt(1) <= level)){
        if (sib.tagName === 'P' || sib.tagName === 'UL') els.push(sib);
        else sib.querySelectorAll('p, ul').forEach(function(x){ if (!x.closest('li')) els.push(x); });
        sib = sib.nextElementSibling;
      }
      break;
    }
    return els;
  }

  var KNOWN_LABELS = /^(description|organi[sz]ed by|participants?|with|speakers?|moderator|moderated by|hosted by|presented by|in partnership with|supported by|spectrum id)$/i;

  // Everything in the Credits section as text lines: each bold label with its value or list
  // (Spectrum ID is left out, as on the credits feed page). Speakers are merged into Participants.
  function creditsText(html){
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var sections = [], cur = null;

    creditsElements(doc).forEach(function(el){
      if (el.tagName === 'UL'){
        if (cur) el.querySelectorAll('li').forEach(function(li){
          var t = clean(li.textContent);
          if (t) cur.items.push(t);
        });
        return;
      }
      el.innerHTML.split(/<br\s*\/?>/i).forEach(function(part){
        var tmp = document.createElement('div');
        tmp.innerHTML = part;
        var b = tmp.querySelector('b, strong');
        var raw = b ? clean(b.textContent) : '';
        var label = raw.replace(/:$/, '');
        if (b && label && (/:$/.test(raw) || KNOWN_LABELS.test(label))){
          b.remove();
          cur = { label: label, value: clean(tmp.textContent).replace(/^:\s*/, ''), items: [] };
          sections.push(cur);
        } else if (cur){
          var t = clean(tmp.textContent);
          if (t) cur.items.push(t);
        }
      });
    });

    sections = sections.filter(function(sec){ return !/^spectrum id$/i.test(sec.label); });

    // The Description goes to its own box (Subtitle), so take it out of the credits list
    var description = '';
    sections = sections.filter(function(sec){
      if (!/^description$/i.test(sec.label)) return true;
      description = [sec.value].concat(sec.items).filter(Boolean).join('\n');
      return false;
    });

    // Speakers listed under their own heading on the page
    var speakers = [];
    doc.querySelectorAll('h2, h3').forEach(function(h){
      var t = clean(h.textContent).toLowerCase();
      if (['speakers', 'speaker', 'panelists', 'panellists'].indexOf(t) === -1) return;
      var sib = h.nextElementSibling;
      while (sib && ['H1', 'H2', 'HR'].indexOf(sib.tagName) === -1){
        if (sib.tagName === 'H3' || sib.tagName === 'H4'){
          var n = clean(sib.textContent);
          if (n) speakers.push(n);
        }
        sib = sib.nextElementSibling;
      }
    });
    if (speakers.length){
      var part = null;
      sections.forEach(function(sec){ if (!part && /^participants?$/i.test(sec.label)) part = sec; });
      if (!part){ part = { label: 'Speakers', value: '', items: [] }; sections.push(part); }
      var have = part.items.map(function(n){ return n.toLowerCase(); });
      speakers.forEach(function(n){
        if (have.indexOf(n.toLowerCase()) === -1){ part.items.push(n); have.push(n.toLowerCase()); }
      });
    }

    var lines = [];
    sections.forEach(function(sec){
      var items = sec.items.filter(function(n){ return !/^tba$/i.test(n); });
      var value = /^tba$/i.test(sec.value) ? '' : sec.value;
      if (!value && !items.length) return;
      if (lines.length) lines.push('');
      lines.push(value ? sec.label + ': ' + value : sec.label + ':');
      items.forEach(function(n){ lines.push(n); });
    });
    return { description: description, credits: lines.join('\n') };
  }

  // Only overwrite a box if it is empty or still holds text this button put there
  function setField(key, val){
    var el = document.querySelector('.field[data-key="' + key + '"]');
    if (!el || !val) return;
    if (el.value === '' || el.value === lastAuto[key]){
      el.value = val;
      lastAuto[key] = val;
      grow(el);
    }
  }

  function doFill(){
    if (!todays.length){ say('No event found on the calendar for today', 4000); return Promise.resolve(); }
    var ev = todays[pick.selectedIndex > 0 ? pick.selectedIndex : 0];
    setField('title', ev.title);
    save();
    say('Title filled. Looking up credits…', 4000);
    return fetchText(ev.link).then(creditsText).then(function(c){
      setField('description', c.description);
      setField('speaker', c.credits);
      save();
      updateChips();
      say((c.description || c.credits) ? 'Filled from the event page' : 'Title filled. No credits listed on the event page', 4000);
    }).catch(function(){
      say('Title filled. Could not load the credits', 4000);
    });
  }

  fillBtn.addEventListener('click', function(){
    fillBtn.disabled = true;
    var job;
    if (listLoaded){
      job = doFill();
    } else {
      say('Looking up today’s event…', 6000);
      job = fetchText(LIST_URL).then(function(html){
        todays = findToday(html);
        listLoaded = true;
        pick.innerHTML = '';
        todays.forEach(function(ev){
          var o = document.createElement('option');
          o.textContent = ev.title;
          pick.appendChild(o);
        });
        pick.hidden = todays.length < 2;
        return doFill();
      }).catch(function(){
        say('Could not reach concordia.ca from this page', 5000);
      });
    }
    job.then(function(){ fillBtn.disabled = false; });
  });
  pick.addEventListener('change', doFill);

  load();
  setLang(lang);
  updateChips();
})();
</script>
</body>
</html>
